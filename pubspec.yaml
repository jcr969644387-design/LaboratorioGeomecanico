name: laboratorio_geomecanico
description: >-
  Laboratorio virtual educativo de mecánica de rocas para estudiantes de
  Ingeniería de Minas: RMR, sistema Q, selección preliminar de sostenimiento,
  casos subterráneos y evaluación práctica.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
