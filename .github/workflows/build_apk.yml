name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "LaboratorioGeomecanico[Vv]*"

permissions:
  contents: write

jobs:
  build_universal_apk:
    name: Generar APK universal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones de las herramientas
        run: |
          flutter --version
          java -version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar APK universal
        run: flutter build apk --release

      - name: Renombrar el APK con la version
        id: apk
        run: |
          set -euo pipefail
          origen=build/app/outputs/flutter-apk/app-release.apk
          test -f "$origen"
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="main-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          destino="dist/LaboratorioGeomecanico-${version}.apk"
          cp "$origen" "$destino"
          ls -lh "$destino"
          echo "path=${destino}" >> "$GITHUB_OUTPUT"
          echo "name=LaboratorioGeomecanico-${version}" >> "$GITHUB_OUTPUT"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publicar release con el APK adjunto
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.apk.outputs.path }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "APK universal de release. Firmado con la clave de depuracion, solo para instalacion educativa: habilita 'Instalar apps de origenes desconocidos' en el telefono." \
            --latest
